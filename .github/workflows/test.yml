name: Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Setup SBCL and ocicl (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install sbcl ocicl dejagnu
          ocicl setup >> ~/.sbclrc

      - name: Setup SBCL and ocicl (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sbcl ocicl dejagnu
          ocicl setup >> ~/.sbclrc

      - uses: actions/cache@v4
        with:
          path: |
            systems
            ~/.cache/common-lisp
          key: ${{ runner.os }}-ocicl-${{ hashFiles('systems.csv') }}
          restore-keys: |
            ${{ runner.os }}-ocicl-

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          ocicl install
          make

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          ocicl install
          make

      # Regression gate: run the fast core suites and fail the build if any
      # test that passed in testsuite/baseline.sum no longer passes, or a new
      # unexpected failure appears. JAVA_HOME is provided by setup-java above;
      # JAVAC defaults to "javac --release 25" (class-file v69).
      - name: Regression gate (Linux)
        if: runner.os == 'Linux'
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          make check-regression
